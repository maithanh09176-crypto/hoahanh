<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4a1036"/>
      <stop offset="60%" stop-color="#280820"/>
      <stop offset="100%" stop-color="#140210"/>
    </radialGradient>
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff73a1" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff2d75" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff99bb"/>
      <stop offset="100%" stop-color="#e61e68"/>
    </linearGradient>
    <linearGradient id="petal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb3cc"/>
      <stop offset="100%" stop-color="#d61b5c"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe6a3"/>
      <stop offset="50%" stop-color="#ffb84d"/>
      <stop offset="100%" stop-color="#d48817"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe-zone margin -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing aura -->
  <circle cx="256" cy="240" r="170" fill="url(#roseGlow)"/>

  <!-- Romantic bouquet wrapping & petals -->
  <g filter="url(#shadow)" transform="translate(256, 235)">
    <!-- Paper wrap background -->
    <path d="M-90,60 L90,60 L60,150 L-60,150 Z" fill="#fce4ec" opacity="0.9"/>
    <path d="M-110,30 L0,-40 L110,30 L70,120 L-70,120 Z" fill="#f8bbd0" opacity="0.75"/>

    <!-- Left rose -->
    <ellipse cx="-60" cy="-30" rx="46" ry="42" fill="url(#petal2)" transform="rotate(-15, -60, -30)"/>
    <!-- Right rose -->
    <ellipse cx="60" cy="-30" rx="46" ry="42" fill="url(#petal2)" transform="rotate(15, 60, -30)"/>
    <!-- Center rose -->
    <circle cx="0" cy="-55" r="54" fill="url(#petal1)"/>
    <path d="M-22,-65 Q0,-85 22,-65 Q30,-45 0,-28 Q-30,-45 -22,-65 Z" fill="#fff0f5" opacity="0.85"/>
    <path d="M-12,-60 Q0,-75 12,-60 Q18,-45 0,-35 Q-18,-45 -12,-60 Z" fill="#d61b5c"/>

    <!-- Rose buds bottom -->
    <ellipse cx="-35" cy="15" rx="38" ry="34" fill="url(#petal1)"/>
    <ellipse cx="35" cy="15" rx="38" ry="34" fill="url(#petal2)"/>

    <!-- Small baby breath floral dots -->
    <circle cx="-100" cy="-10" r="6" fill="#ffffff" opacity="0.9"/>
    <circle cx="-85" cy="-60" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="-45" cy="-100" r="6" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="-115" r="7" fill="#ffffff" opacity="0.9"/>
    <circle cx="45" cy="-100" r="6" fill="#ffffff" opacity="0.9"/>
    <circle cx="85" cy="-60" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="100" cy="-10" r="6" fill="#ffffff" opacity="0.9"/>

    <!-- Gold Silk Ribbon -->
    <g transform="translate(0, 95)">
      <!-- Left bow loop -->
      <path d="M0,0 C-40,-35 -80,-10 -60,15 C-45,30 -10,10 0,0 Z" fill="url(#goldRibbon)"/>
      <!-- Right bow loop -->
      <path d="M0,0 C40,-35 80,-10 60,15 C45,30 10,10 0,0 Z" fill="url(#goldRibbon)"/>
      <!-- Ribbon tails -->
      <path d="M-10,5 L-35,65 L-18,55 L0,10 Z" fill="url(#goldRibbon)"/>
      <path d="M10,5 L35,65 L18,55 L0,10 Z" fill="url(#goldRibbon)"/>
      <!-- Center knot -->
      <circle cx="0" cy="0" r="14" fill="#ffd166"/>
      <circle cx="0" cy="0" r="8" fill="#e59819"/>
    </g>
  </g>

  <!-- 20/10 Gold Badge -->
  <g transform="translate(256, 420)">
    <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#2d0621" stroke="#ff85b3" stroke-width="2"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="22" fill="#ffe6f2" text-anchor="middle" letter-spacing="2">20/10 · LOVE</text>
  </g>
</svg>
